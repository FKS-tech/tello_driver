tello_joy_node:
  ros__parameters:
    tello_ip: "192.168.10.1"
    tello_port: 8889
    local_port: 9000
    sdk_timeout: 5.0
    joy_topic: "/joy"
    axis_yaw: 0
    axis_up_down: 1
    axis_left_right: 3
    axis_forward_back: 4
    button_land: 0
    button_takeoff: 3
    deadzone: 0.30
    rc_period: 0.05
    joy_timeout: 0.30
    command_cooldown: 3.0
    takeoff_rc_pause: 3.0
    land_rc_pause: 2.0

tello_video_node:
  ros__parameters:
    stream_url: "udp://0.0.0.0:11111?fifo_size=50000000&overrun_nonfatal=1"
    publish_topic: "/tello/image_raw"
    show_preview: true
    timer_period: 0.03
    enable_sdk_init: true
    enable_stream_on: true
    command_local_port: 9001
    sdk_timeout: 5.0

tello_telemetry_node:
  ros__parameters:
    telemetry_port: 8890
    raw_topic: "/tello/telemetry/raw"
    json_topic: "/tello/telemetry/json"
    poll_period: 0.05
    log_summary: true

vision_node:
  ros__parameters:
    input_topic: "/tello/image_raw"
    output_image_topic: "/vision/image_annotated"
    output_detection_topic: "/vision/detections"
    model_path: "yolov8n.pt"
    confidence_threshold: 0.5
    process_every_n_frames: 3
    show_preview: true

qr_node:
  ros__parameters:
    input_topic: "/tello/image_raw"
    output_detection_topic: "/vision/qr_codes"
    output_image_topic: "/vision/qr_image_annotated"
    debug_topic: "/vision/qr_debug"
    show_preview: false
    process_every_n_frames: 1
    publish_empty: true
    publish_undecoded: false
    min_area_ratio: 0.0001
    use_preprocessing: true
    try_grayscale: true
    try_clahe: true
    try_adaptive_threshold: true
    try_upscale: true
    upscale_factor: 1.5

landing_base_node:
  ros__parameters:
    input_topic: "/tello/image_raw"
    output_detection_topic: "/vision/landing_base"
    output_image_topic: "/vision/landing_base_image_annotated"
    debug_topic: "/vision/landing_base_debug"
    output_mask_topic: "/vision/landing_base_mask"
    show_preview: false
    process_every_n_frames: 1
    min_area_ratio: 0.01
    max_area_ratio: 0.80
    min_yellow_ratio_in_bbox: 0.02
    min_blue_ratio_in_bbox: 0.05
    min_color_score: 0.45
    min_shape_score: 0.35
    min_pattern_score: 0.35
    max_color_only_confidence: 0.60
    max_overexposed_ratio: 0.35
    landing_square_max_aspect: 1.60
    enable_takeoff_base_detection: true
    takeoff_min_aspect: 1.60
    takeoff_max_aspect: 4.00
    pattern_roi_size: 240
    border_band_fraction: 0.08
    circle_radius_min_fraction: 0.21
    circle_radius_max_fraction: 0.34
    cross_band_fraction: 0.06
    temporal_window_size: 5
    min_temporal_hits: 2
    temporal_max_center_distance_norm: 0.18
    temporal_max_area_ratio_delta: 0.12
    morph_kernel_size: 5
    publish_empty: true
    publish_mask: false
    yellow_lower_h: 20
    yellow_lower_s: 80
    yellow_lower_v: 80
    yellow_upper_h: 40
    yellow_upper_s: 255
    yellow_upper_v: 255
    blue_lower_h: 90
    blue_lower_s: 60
    blue_lower_v: 50
    blue_upper_h: 135
    blue_upper_s: 255
    blue_upper_v: 255

mission_node:
  ros__parameters:
    mission_id: "phase1_demo"
    dry_run: true
    auto_start: false
    target_class_name: "landing_base"
    telemetry_topic: "/tello/telemetry/json"
    landing_base_topic: "/vision/landing_base"
    cmd_vel_topic: "/tello/autonomy/cmd_vel"
    enable_topic: "/tello/autonomy/enable"
    disable_topic: "/tello/autonomy/disable"
    stop_topic: "/tello/autonomy/stop"
    takeoff_topic: "/tello/autonomy/takeoff"
    land_topic: "/tello/autonomy/land"
    status_topic: "/mission/status"
    event_topic: "/mission/event"
    map_topic: "/mission/map"
    start_topic: "/mission/start"
    abort_topic: "/mission/abort"
    reset_topic: "/mission/reset"
    control_rate_hz: 10.0
    min_battery_percent: 35
    stabilize_duration_sec: 3.0
    scan_duration_sec: 10.0
    scan_yaw_speed: 15.0
    align_error_x_threshold: 0.15
    align_yaw_gain: 25.0
    max_yaw_cmd: 20.0
    approach_speed: 10.0
    landing_area_ratio_threshold: 0.28
    detection_timeout_sec: 1.0

visual_servo_node:
  ros__parameters:
    input_detection_topic: "/vision/detections"
    target_class_name: ""
    confidence_threshold: 0.5
    min_area_ratio: 0.0
    max_area_ratio: 1.0
    yaw_kp: 35.0
    max_yaw_speed: 30.0
    center_deadband: 0.10
    detection_timeout: 0.5
    publish_zero_when_lost: true
    target_selection_strategy: "closest_to_center"
    enable_target_lock: true
    target_lock_timeout: 1.0
    target_lock_max_error_distance: 0.35

command_mux_node:
  ros__parameters:
    tello_ip: "192.168.10.1"
    tello_port: 8889
    local_port: 9002
    sdk_timeout: 5.0
    enable_sdk_init: true
    cmd_vel_topic: "/tello/autonomy/cmd_vel"
    takeoff_topic: "/tello/autonomy/takeoff"
    land_topic: "/tello/autonomy/land"
    emergency_topic: "/tello/autonomy/emergency"
    enable_topic: "/tello/autonomy/enable"
    disable_topic: "/tello/autonomy/disable"
    stop_topic: "/tello/autonomy/stop"
    rc_period: 0.05
    watchdog_timeout: 0.4
    command_cooldown: 3.0
    takeoff_rc_pause: 3.0
    land_rc_pause: 2.0
    start_armed: false
    max_xy_speed: 30.0
    max_z_speed: 25.0
    max_yaw_speed: 30.0
